<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TrueMatch - Meet Real People</title>
  <meta name="description" content="TrueMatch is a free dating site for 18+ adults. Discover real people nearby, find a match and start chatting.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://realdatingclub.github.io/truematch/">
  <meta property="og:title" content="TrueMatch - Meet Real People">
  <meta property="og:description" content="Discover real people nearby, find a match, build a connection and start chatting. 18+ only.">
  <meta property="og:image" content="https://realdatingclub.github.io/truematch/preview.jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="628">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="TrueMatch - Meet Real People">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TrueMatch - Meet Real People">
  <meta name="twitter:description" content="Discover real people nearby, find a match, build a connection and start chatting. 18+ only.">
  <meta name="twitter:image" content="https://realdatingclub.github.io/truematch/preview.jpeg">
  <meta name="twitter:image:alt" content="TrueMatch - Meet Real People">
  <meta name="twitter:image:width" content="1200">
  <meta name="twitter:image:height" content="628">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "DM Sans", Arial, sans-serif;
      background: #000;
    }

    body {
      color: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 20%,
        rgba(0, 0, 0, 0.25) 48%,
        rgba(0, 0, 0, 0.82) 100%
      );
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(100%, 760px);
      height: 30svh;
      min-height: 230px;
      max-height: 360px;
      margin: 0 auto;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 24px 24px 0 0;
    }

    .badge {
      display: inline-block;
      align-self: center;
      margin-bottom: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1.05;
      font-weight: 800;
    }

    p {
      margin: 0 auto 18px;
      max-width: 560px;
      font-size: clamp(14px, 3.8vw, 18px);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .cta:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .cta:active {
      transform: scale(0.97);
    }

    .fine-print {
      margin-top: 9px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
    }

    @media (max-width: 480px) {
      .card {
        height: 30svh;
        min-height: 235px;
        padding: 22px 18px 18px;
        border-radius: 20px 20px 0 0;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 14px;
        margin-bottom: 14px;
      }

      .cta {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- Main landing-page image -->
    <!-- Put img.jpeg in the same folder as index.html -->
    <img
      class="hero-image"
      src="img.jpeg"
      alt="People connecting and dating"
    >

    <div class="shade"></div>

    <section class="card">

      <div class="badge">
        18+ REAL CONNECTIONS
      </div>

      <h1>
        Meet Someone Real
      </h1>

      <p>
        Discover interesting people nearby,
        build a genuine connection and start chatting today.
      </p>

      <!-- CTA -->
      <a
        class="cta"
        href="https://cutt.ly/6ymAQaec"
      >
        Find Your Match
      </a>

      <div class="fine-print">
        Free to join • Real People • Verified Profiles
      </div>

    </section>

  </main>

</body>
</html>
