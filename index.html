<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="RealDatingClub - Meet real people, discover matches nearby and start chatting. 18+ only.">

  <title>RealDatingClub - Meet Real People</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://realdatingclub.github.io/truematch/">
  <meta property="og:title" content="RealDatingClub - Meet Real People">
  <meta property="og:description" content="Discover interested singles nearby, find a match, build connections and start chatting. 18+ only.">
  <meta property="og:image" content="https://realdatingclub.github.io/truematch/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- X / Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RealDatingClub - Meet Real People">
  <meta name="twitter:description" content="Discover interested singles nearby, find a match, build connections and start chatting. 18+ only.">
  <meta name="twitter:image" content="https://realdatingclub.github.io/truematch/preview.jpg">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.08) 0%,
        rgba(0,0,0,.12) 45%,
        rgba(0,0,0,.72) 100%
      );
    }

    .card {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      width: min(90%, 520px);
      height: 35%;
      min-height: 220px;
      max-height: 340px;
      box-sizing: border-box;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(0, 0, 0, .50);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.05;
      font-weight: 800;
    }

    p {
      margin: 0 auto 20px;
      max-width: 460px;
      font-size: clamp(15px, 4vw, 19px);
      line-height: 1.45;
      color: rgba(255,255,255,.94);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: 50px;
      margin: 0 auto;
      border-radius: 999px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-sizing: border-box;
    }

    .age {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255,255,255,.7);
    }

    @media (max-width: 480px) {
      .card {
        width: 92%;
        bottom: 3%;
        padding: 22px 18px;
        border-radius: 20px;
      }

      h1 {
        margin-bottom: 9px;
      }

      p {
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <!-- Replace preview.jpg with your actual landing-page image if needed -->
    <img src="preview.jpg" alt="RealDatingClub">

    <div class="overlay"></div>

    <section class="card">
      <h1>RealDatingClub</h1>

      <p>
        RealDatingClub is a free dating site for 18+ adults looking to meet real people.
        Discover interested singles nearby, find a match, build connections and start chatting.
      </p>

      <a class="btn" href="#" aria-label="Find your match">Find Your Match</a>

      <div class="age">18+ adults only</div>
    </section>
  </main>
</body>
</html>
